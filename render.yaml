databases:
  - name: banking-db
    databaseName: banking_db
    user: banking_user
    plan: free

services:
  # ── Spring Boot Backend ──────────────────────────────────────────
  - type: web
    name: banking-backend
    runtime: java
    plan: free
    rootDir: .
    buildCommand: "./mvnw clean package -DskipTests -Dspring-boot.run.profiles=prod"
    startCommand: "java -Dserver.port=$PORT -jar target/banking-transaction-management-1.0.0.jar"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://banking-frontend.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /v3/api-docs

  # ── React Frontend ───────────────────────────────────────────────
  - type: web
    name: banking-frontend
    runtime: static
    plan: free
    rootDir: banking-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://banking-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
